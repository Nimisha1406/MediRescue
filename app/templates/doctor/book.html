{% extends "base.html" %}

{% block title %}Book Appointment | MediRescue{% endblock %}

{% block content %}

<div class="row justify-content-center mt-4">
    <div class="col-md-7">

        <div class="card shadow border-0">

            <div class="card-header bg-primary text-white text-center p-3">
                <h3 class="mb-0">Book Doctor Appointment</h3>
            </div>

            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <div style="font-size: 55px;">👨‍⚕️</div>
                    <h4>{{ doctor.name }}</h4>
                    <p class="text-muted">{{ doctor.specialty }}</p>
                    <p>
                        <strong>Consultation Fee:</strong>
                        ₹{{ doctor.consultation_fee }}
                    </p>
                </div>

                <hr>

                <form method="POST"
                      action="{{ url_for('doctor.book_appointment', doctor_id=doctor.id) }}">

                    <input type="hidden" name="csrf_token"
                           value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">Appointment Date</label>
                        <input type="date"
                               name="appointment_date"
                               class="form-control"
                               min="{{ today }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Appointment Time</label>
                        <select name="appointment_time"
                                class="form-select" required>
                            <option value="">Select a time</option>
                            <option value="09:00 AM">09:00 AM</option>
                            <option value="10:00 AM">10:00 AM</option>
                            <option value="11:00 AM">11:00 AM</option>
                            <option value="12:00 PM">12:00 PM</option>
                            <option value="02:00 PM">02:00 PM</option>
                            <option value="03:00 PM">03:00 PM</option>
                            <option value="04:00 PM">04:00 PM</option>
                            <option value="05:00 PM">05:00 PM</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            Reason for Consultation
                        </label>
                        <textarea name="reason"
                                  class="form-control"
                                  rows="4"
                                  placeholder="Briefly describe your health concern"></textarea>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Confirm Appointment Request
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
