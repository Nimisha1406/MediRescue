{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card mx-auto shadow p-4" style="max-width: 450px;">

        <h3 class="text-center mb-3">Reset Your Password</h3>

        <p class="text-center text-muted">
            Enter the OTP sent to your registered email and choose a new password.
        </p>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">6-Digit OTP</label>
                <input
                    type="text"
                    name="otp"
                    class="form-control"
                    placeholder="Enter OTP"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Reset Password
            </button>

        </form>

        <form method="POST"
              action="{{ url_for('auth.resend_reset_otp') }}"
              class="mt-3">

            <button type="submit" class="btn btn-outline-secondary w-100">
                Resend OTP
            </button>

        </form>

        <p class="text-center mt-3">
            <a href="{{ url_for('auth.login') }}">Back to Login</a>
        </p>

    </div>
</div>
{% endblock %}
